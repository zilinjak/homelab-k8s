image:
  repository: ghcr.io/linuxserver/sonarr
  # Multi-architecture stable image, including arm64 for the Raspberry Pi.
  tag: latest@sha256:f247545d23ba8b233d6604575347e48a623fe6ad75dda02348bf81917f3b5c06
  pullPolicy: IfNotPresent

timezone: Europe/Prague
# Match Transmission's ownership on the shared volume.
puid: "0"
pgid: "0"

config:
  storageClassName: longhorn-static
  size: 2Gi

media:
  existingClaim: pms-config-plex-media-server-0
  # ReadWriteOnce storage must be mounted on the same node as Plex.
  plexInstance: plex-media-server

ingress:
  className: nginx
  host: sonarr.internal.zilinek.fun

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
